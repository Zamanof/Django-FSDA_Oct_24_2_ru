{% extends 'base.html' %}
{% block title %}
	Create new note
{% endblock %}

{% block content %}
	<h1>✏️ Create Note</h1>

        <p>
            Add a new note to your Knowledge Hub.
        </p>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="post" action="{% url 'note_create' %}">

            {% csrf_token %}
            <p>
                <label>Title</label>
                <input
                    type="text"
                    name="title"
                    value="{{ title }}"
                    placeholder="Enter note title"
                    required
                >
            </p>

            <p>
                <label>Text</label>
                <textarea
                    name="content"
                    rows="6"
                    placeholder="Write your note..."
                >{{ content }}</textarea>
            </p>

            <p>
                <label>Tags</label>
                <input
                    type="text"
                    name="tags"
                    value="{{ tags }}"
                    placeholder="Example: django python"
                >
            </p>

            <p>
                <label>Category</label>
                <input
                    type="text"
                    name="category"
                    value="{{ category }}"
                    placeholder="Example: backend"
                >
            </p>

            <p>
                <button type="submit">
                    Save Note
                </button>
            </p>

        </form>

        <div class="actions">
            <a href="{% url 'notes_list' %}">
                ← Cancel and return to Notes
            </a>
        </div>

{% endblock %}
