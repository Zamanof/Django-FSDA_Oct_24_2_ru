{% extends 'base.html' %}

{% block content %}
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h1 class="h3 mb-3">📚 Knowledge Hub</h1>
            <p class="text-muted">
                Welcome to Knowledge Hub.
                Here you can create and manage your notes.
            </p>

            <div class="d-flex flex-wrap gap-2 mt-4">
                <a class="btn btn-primary" href="{% url 'notes:notes_list' %}">
                    View Notes
                </a>

                <a class="btn btn-outline-primary" href="{% url 'notes:note_create' %}">
                    Create Note
                </a>
            </div>
        </div>
    </div>
{% endblock %}
