{% extends 'base.html' %}
{% block title %}
    Create new note
{% endblock %}

{% block content %}
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h1 class="h3 mb-3">✏️ Create Note</h1>

            <p class="text-muted">
                Add a new note to your Knowledge Hub.
            </p>

            <form method="post">

                {% csrf_token %}
                {% include 'includes/bootstrap_form.html' %}
                <p>
                    <button type="submit" class="btn btn-primary">
                        Save Note
                    </button>
                </p>
            </form>
            <div class="mt-3">
                <a href="{% url 'notes:notes_list' %}" class="link-secondary text-decoration-none">
                    ← Cancel and return to Notes
                </a>
            </div>
        </div>
    </div>

{% endblock %}
