<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                font-family: Arial, sans-serif;
                background: #f4f6f8;
                color: #2d3436;
            }

            .container {
                max-width: 800px;
                margin: 50px auto;
                padding: 30px;
                background: white;
                border-radius: 12px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            }

            h1 {
                margin-top: 0;
                color: #2c3e50;
            }

            a {
                color: #3498db;
                text-decoration: none;
            }

            a:hover {
                text-decoration: underline;
            }

            .notes {
                list-style: none;
                padding: 0;
            }

            .notes li {
                margin-bottom: 10px;
                padding: 15px;
                background: #f8f9fa;
                border-radius: 8px;
                border-left: 4px solid #3498db;
            }

            .notes li:hover {
                background: #eef5fb;
            }

            label {
                font-weight: bold;
            }

            input,
            textarea {
                width: 100%;
                padding: 10px;
                margin-top: 6px;
                border: 1px solid #ccc;
                border-radius: 6px;
                font-size: 14px;
            }

            input:focus,
            textarea:focus {
                outline: none;
                border-color: #3498db;
            }

            button,
            .button {
                display: inline-block;
                padding: 10px 18px;
                background: #3498db;
                color: white;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                font-size: 14px;
                text-decoration: none;
            }

            button:hover,
            .button:hover {
                background: #2980b9;
                text-decoration: none;
            }

            .error {
                padding: 10px;
                background: #ffe5e5;
                color: #c0392b;
                border-radius: 6px;
                margin-bottom: 15px;
            }

            .actions {
                margin-top: 25px;
            }

            .note-body {
                line-height: 1.6;
                padding: 15px;
                background: #f8f9fa;
                border-radius: 8px;
            }
        </style>
</head>
<body>

<h1>📚 Knowledge Hub</h1>
        <p>
            Welcome to Knowledge Hub.
            Here you can create and manage your notes.
        </p>

        <div class="actions">
            <a class="button" href="#">
                View Notes
            </a>

            <a class="button" href="#">
                Create Note
            </a>
        </div>
</body>
</html>
